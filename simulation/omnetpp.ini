[General]
network = CavPqcNetwork
sim-time-limit = 5s
result-dir = ../../results/raw/omnetpp-v2r
seed-set = ${repetition}
repeat = 1
**.scalar-recording = true
**.vector-recording = true

# Phase 5 authenticated key-establishment milestone only.
# Mobility/handover/V2V/PBFT are intentionally not active yet.
*.cav.pseudonym = "PID-CAV-001"
*.cav.rsuId = "RSU-A"
*.rsu.rsuId = "RSU-A"
*.cav.maxClockSkewMs = 200
*.rsu.maxClockSkewMs = 200

# Frozen parameter placeholders for later Veins/SUMO scenarios.
*.vehicleDensity = 1
*.vehicleSpeedKmph = 50
*.rsuSpacingMeters = 400
*.tokenValiditySeconds = 5
*.kemAlgorithm = "ML-KEM-768"
*.signatureAlgorithm = "ML-DSA-65"

[Config V2RHandshake]
description = "Direct CAV-to-RSU authenticated key-establishment smoke simulation"
