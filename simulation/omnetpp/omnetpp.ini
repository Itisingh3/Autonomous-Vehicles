[General]
network = CavPqcUnitNetwork
sim-time-limit = 10s
seed-set = ${repetition}
repeat = 1
**.scalar-recording = true
**.vector-recording = true

# Final experiments vary one parameter family at a time; these are first V2R smoke defaults.
*.playgroundSizeX = 2500m
*.playgroundSizeY = 2500m
*.playgroundSizeZ = 50m
*.manager.updateInterval = 1s
*.manager.host = "localhost"
*.manager.port = 9999
*.manager.autoShutdown = true
*.manager.launchConfig = xmldoc("../sumo/erlangen.launchd.xml")

*.numVehicles = ${vehicleDensity=1}
*.node[*].applType = "CAVApp"
*.node[*].appl.headerLength = 80 bit
*.node[*].appl.sendBeacons = false
*.node[*].appl.dataOnSch = false
*.node[*].appl.pseudonym = "cav-001"
*.node[*].appl.targetRsu = "rsu-001"
*.node[*].appl.startAt = uniform(5s, 6s)
*.node[*].appl.maxClockSkew = 200ms
*.rsu[*].applType = "RSUApp"
*.rsu[*].appl.headerLength = 80 bit
*.rsu[*].appl.sendBeacons = false
*.rsu[*].appl.dataOnSch = false
*.rsu[*].appl.maxClockSkew = 200ms
*.node[*].appl.kemAlgorithm = "ML-KEM-768"
*.node[*].appl.signatureAlgorithm = "ML-DSA-65"
*.rsu[*].appl.kemAlgorithm = "ML-KEM-768"
*.rsu[*].appl.signatureAlgorithm = "ML-DSA-65"
*.rsu[0].mobility.x = 2000
*.rsu[0].mobility.y = 2000
*.rsu[0].mobility.z = 3

# Scenario controls reserved for SUMO/Veins configuration.
**.vehicleSpeedKmph = ${vehicleSpeed=50}
**.rsuSpacingMeters = ${rsuSpacing=400}
**.tokenValidity = 5s

# 802.11p baseline
**.nic.mac1609_4.useServiceChannel = false
**.nic.mac1609_4.bitrate = 6Mbps
**.nic.mac1609_4.txPower = 20mW
**.nic.phy80211p.minPowerLevel = -110dBm
**.nic.phy80211p.useNoiseFloor = true
**.nic.phy80211p.noiseFloor = -98dBm
**.nic.phy80211p.decider = xmldoc("../sumo/config-static.xml")
**.nic.phy80211p.analogueModels = xmldoc("../sumo/config-static.xml")
**.nic.phy80211p.usePropagationDelay = true
**.nic.phy80211p.antenna = xmldoc("../sumo/antenna.xml", "/root/Antenna[@id='monopole']")
*.connectionManager.sendDirect = true
*.connectionManager.maxInterfDist = 2600m

# Deterministic V2R test topology (one CAV and one RSU at fixed positions).
*.cav[0].appl.headerLength = 80 bit
*.cav[0].appl.sendBeacons = false
*.cav[0].appl.dataOnSch = false
*.cav[0].appl.pseudonym = "cav-001"
*.cav[0].appl.targetRsu = "rsu-001"
*.cav[0].appl.nextRsu = "rsu-002"
*.cav[0].appl.startAt = 1s
*.cav[0].appl.maxClockSkew = 200ms
*.cav[0].appl.kemAlgorithm = "ML-KEM-768"
*.cav[0].appl.signatureAlgorithm = "ML-DSA-65"
*.rsu[0].appl.headerLength = 80 bit
*.rsu[0].appl.sendBeacons = false
*.rsu[0].appl.dataOnSch = false
*.rsu[0].appl.rsuId = "rsu-001"
*.rsu[0].appl.nextRsu = "rsu-002"
*.rsu[1].appl.rsuId = "rsu-002"
*.rsu[1].appl.nextRsu = ""
*.rsu[1].mobility.x = 200
*.rsu[1].mobility.y = 100
*.rsu[1].mobility.z = 3
*.rsu[*].appl.tokenValidity = 5s
*.rsu[*].appl.vehicleSpeedKmph = 50
*.rsu[*].appl.vehicleHeadingDeg = 0
*.rsu[*].appl.rsuSpacingMeters = 400
*.rsu[0].appl.maxClockSkew = 200ms
*.rsu[0].appl.kemAlgorithm = "ML-KEM-768"
*.rsu[0].appl.signatureAlgorithm = "ML-DSA-65"

[Config SumoIntegration]
network = CavPqcNetwork
**.nic.phy80211p.decider = xmldoc("../sumo/config.xml")
**.nic.phy80211p.analogueModels = xmldoc("../sumo/config.xml")
*.obstacles.obstacles = xmldoc("../sumo/config.xml", "//AnalogueModel[@type='SimpleObstacleShadowing']/obstacles")
