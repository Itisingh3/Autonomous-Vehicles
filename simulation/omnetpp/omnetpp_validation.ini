[General]
network = CavPqcUnitNetwork
sim-time-limit = 30s
repeat = 1
seed-set = ${repetition}
**.scalar-recording = true
**.vector-recording = true
*.playgroundSizeX = 2500m
*.playgroundSizeY = 2500m
*.playgroundSizeZ = 50m
*.manager.updateInterval = 1s
*.manager.host = "localhost"
*.manager.port = 9999
*.manager.autoShutdown = true
*.manager.launchConfig = xmldoc("../sumo/erlangen.launchd.xml")
**.nic.mac1609_4.useServiceChannel = false
**.nic.mac1609_4.bitrate = 6Mbps
**.nic.mac1609_4.txPower = 20mW
**.nic.phy80211p.minPowerLevel = -110dBm
**.nic.phy80211p.useNoiseFloor = true
**.nic.phy80211p.noiseFloor = -98dBm
**.nic.phy80211p.decider = xmldoc("../sumo/config-static.xml")
**.nic.phy80211p.analogueModels = xmldoc("../sumo/config-static.xml")
**.nic.phy80211p.usePropagationDelay = true
*.connectionManager.sendDirect = true
*.connectionManager.maxInterfDist = 2600m
*.cav[0].appl.startAt = 1s
*.cav[0].appl.pseudonym = "cav-001"
*.cav[0].appl.targetRsu = "rsu-001"
*.cav[0].appl.nextRsu = "rsu-002"
*.cav[0].appl.numRsus = 5
*.cav[0].appl.kemAlgorithm = "ML-KEM-768"
*.cav[0].appl.signatureAlgorithm = "ML-DSA-65"
*.rsu[0].appl.rsuId = "rsu-001"
*.rsu[0].appl.nextRsu = "rsu-002"
*.rsu[1].appl.rsuId = "rsu-002"
*.rsu[1].appl.nextRsu = "rsu-003"
*.rsu[2].appl.rsuId = "rsu-003"
*.rsu[2].appl.nextRsu = "rsu-004"
*.rsu[3].appl.rsuId = "rsu-004"
*.rsu[3].appl.nextRsu = "rsu-005"
*.rsu[4].appl.rsuId = "rsu-005"
*.rsu[4].appl.nextRsu = ""
*.rsu[0].mobility.x = 100
*.rsu[1].mobility.x = 350
*.rsu[2].mobility.x = 600
*.rsu[3].mobility.x = 850
*.rsu[4].mobility.x = 1100
*.rsu[*].mobility.y = 100
*.rsu[*].mobility.z = 3
*.rsu[*].appl.tokenValidity = 5s
*.rsu[*].appl.vehicleSpeedKmph = ${vehicleSpeed=50}
*.rsu[*].appl.rsuSpacingMeters = ${rsuSpacing=400}
*.rsu[*].appl.vehicleHeadingDeg = 0
*.cav[0].appl.maxClockSkew = 200ms
*.rsu[*].appl.maxClockSkew = 200ms
